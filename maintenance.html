<title>AzTUgram – Təkmilləşdirmə işləri aparılır</title>
<style>
  :root {
    --navy: #0f2144;
    --navy-deep: #0a1730;
    --gold: #c9a45c;
    --sand: #e9d3a8;
    --muted: #a9b6cf;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(ellipse at 50% 30%, var(--navy) 0%, var(--navy-deep) 75%);
    color: #fff;
    font-family: Georgia, "Times New Roman", serif;
    display: grid;
    place-items: center;
    padding: 24px;
    text-align: center;
  }
  main { max-width: 560px; width: 100%; }
  .logo {
    width: clamp(160px, 38vw, 230px);
    height: clamp(160px, 38vw, 230px);
    border-radius: 50%;
    display: block;
    margin: 0 auto 32px;
    box-shadow: 0 0 0 3px var(--gold), 0 18px 50px rgba(0,0,0,.45);
  }
  h1 {
    font-size: clamp(1.6rem, 5.2vw, 2.4rem);
    line-height: 1.25;
    margin: 0 0 16px;
    font-weight: 700;
    color: var(--sand);
  }
  p {
    font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    color: var(--muted);
    font-size: 1.05rem;
    line-height: 1.65;
    margin: 0 auto 10px;
    max-width: 440px;
  }
  .bar { height: 3px; width: 160px; background: rgba(201,164,92,.25); border-radius: 2px; overflow: hidden; margin: 32px auto 0; }
  .bar span { display: block; height: 100%; width: 45%; background: var(--gold); animation: slide 2.2s ease-in-out infinite; }
  @keyframes slide { 0% { margin-left: -45%; } 100% { margin-left: 100%; } }
  @media (prefers-reduced-motion: reduce) { .bar span { animation: none; width: 100%; opacity: .6; } }
</style>
